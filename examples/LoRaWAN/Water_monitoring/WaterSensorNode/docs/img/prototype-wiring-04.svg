<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img"
             aria-label="Power chain: solar panel through a TVS diode to the MPPT charge controller, then the 18650 battery, then a PTC fuse and SS34 Schottky diode with a TVS across the rail. The protected rail feeds the board directly at 3.7 volts and, on a second branch, a Pololu number 2810 MOSFET switch controlled by pin D5, then a U3V9F12 boost converter to a fixed 12 volts, then a 1000 microfarad bulk capacitor to the sensor rail. The switch sits before the converter so the converter itself is unpowered between measurements."><rect x="-10000" y="-10000" width="20000" height="20000" fill="#FFFFFF"/>
          <defs>
            <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#B45F09"/>
            </marker>
          </defs>
          <g font-family="IBM Plex Mono, monospace" font-size="12" fill="currentColor">

            <g stroke="currentColor" stroke-width="1.3" fill="none">
              <rect x="16"  y="70" width="112" height="48" rx="2"/>
              <rect x="196" y="70" width="120" height="48" rx="2"/>
              <rect x="384" y="70" width="120" height="48" rx="2"/>
              <rect x="572" y="70" width="120" height="48" rx="2"/>
            </g>
            <text x="72"  y="90"  text-anchor="middle">Solar 6 V</text>
            <text x="72"  y="106" text-anchor="middle" fill="#7B9099" font-size="11">5–10 W</text>
            <text x="256" y="90"  text-anchor="middle">Charge ctrl</text>
            <text x="256" y="106" text-anchor="middle" fill="#7B9099" font-size="11">MPPT</text>
            <text x="444" y="90"  text-anchor="middle">Battery</text>
            <text x="444" y="106" text-anchor="middle" fill="#7B9099" font-size="11">18650 · 3.0–4.2 V</text>
            <text x="632" y="90"  text-anchor="middle">Pololu #2810</text>
            <text x="632" y="106" text-anchor="middle" fill="#7B9099" font-size="11">MOSFET switch</text>

            <g stroke="#B45F09" stroke-width="2.2" marker-end="url(#ar3)">
              <line x1="128" y1="94" x2="190" y2="94"/>
              <line x1="316" y1="94" x2="378" y2="94"/>
              <line x1="504" y1="94" x2="566" y2="94"/>
              <line x1="692" y1="94" x2="754" y2="94"/>
            </g>

            <!-- protection markers on the battery-to-boost run -->
            <g stroke="currentColor" stroke-width="1.4" fill="#FFFFFF">
              <rect x="510" y="40" width="48" height="20" rx="2"/>
            </g>
            <text x="534" y="54" text-anchor="middle" font-size="10">PTC 2.6 A</text>
            <line x1="534" y1="60" x2="534" y2="94" stroke="currentColor" stroke-width="1.2"/>

            <g stroke="currentColor" stroke-width="1.4" fill="#FFFFFF">
              <rect x="470" y="150" width="52" height="20" rx="2"/>
              <rect x="540" y="150" width="60" height="20" rx="2"/>
            </g>
            <text x="496" y="164" text-anchor="middle" font-size="10">SS34</text>
            <text x="570" y="164" text-anchor="middle" font-size="10">SMBJ5.0A</text>
            <line x1="496" y1="150" x2="496" y2="94"  stroke="currentColor" stroke-width="1.2"/>
            <line x1="570" y1="150" x2="570" y2="94"  stroke="currentColor" stroke-width="1.2"/>
            <line x1="570" y1="170" x2="570" y2="266" stroke="currentColor" stroke-width="1.2"/>
            <text x="470" y="188" font-size="10" fill="#7B9099">reverse-polarity · TVS clamp</text>

            <!-- TVS on solar input -->
            <g stroke="currentColor" stroke-width="1.4" fill="#FFFFFF">
              <rect x="132" y="150" width="60" height="20" rx="2"/>
            </g>
            <text x="162" y="164" text-anchor="middle" font-size="10">TVS</text>
            <line x1="162" y1="150" x2="162" y2="94"  stroke="currentColor" stroke-width="1.2"/>
            <line x1="162" y1="170" x2="162" y2="266" stroke="currentColor" stroke-width="1.2"/>

            <!-- branch to board -->
            <path d="M 444 118 L 444 220 L 300 220" stroke="#0D6E88" stroke-width="2" fill="none"/>
            <rect x="176" y="196" width="124" height="48" rx="2" fill="#EBF1F3" stroke="currentColor" stroke-width="1.3"/>
            <text x="238" y="216" text-anchor="middle">WaziSense</text>
            <text x="238" y="232" text-anchor="middle" fill="#7B9099" font-size="11">VIN · 3.3 V logic</text>
            <text x="330" y="212" fill="#0D6E88" font-size="11">3.7 V</text>

            <!-- high-side switch -->
            <rect x="758" y="70" width="126" height="48" rx="2" stroke="currentColor" stroke-width="1.3" fill="none"/>
            <text x="821" y="90"  text-anchor="middle">U3V9F12 boost</text>
            <text x="821" y="106" text-anchor="middle" fill="#7B9099" font-size="11">→ 12 V fixed</text>
            <path d="M 300 236 L 632 236 L 632 120"
                  stroke="#0D6E88" stroke-width="1.6" stroke-dasharray="5 4" fill="none"/>
            <text x="336" y="252" fill="#0D6E88" font-size="11">D5 → #2810 ON (boots OFF)</text>

            <!-- bulk cap + rail out -->
            <line x1="884" y1="94" x2="960" y2="94" stroke="#B45F09" stroke-width="2.6"/>
            <g stroke="#B45F09" stroke-width="2">
              <line x1="916" y1="94" x2="916" y2="120"/>
              <line x1="904" y1="120" x2="928" y2="120"/>
              <line x1="904" y1="127" x2="928" y2="127"/>
              <line x1="916" y1="127" x2="916" y2="266"/>
            </g>
            <text x="934" y="122" fill="#7B9099" font-size="10">1000 µF</text>
            <text x="960" y="80" text-anchor="end" fill="#B45F09" font-size="11">+12 V rail →</text>

            <!-- ground -->
            <line x1="16" y1="266" x2="960" y2="266" stroke="#7B9099" stroke-width="2.6"/>
            <g stroke="#7B9099" stroke-width="1.4">
              <line x1="72"  y1="118" x2="72"  y2="266"/>
              <line x1="256" y1="118" x2="256" y2="266"/>
              <line x1="444" y1="118" x2="444" y2="196"/>
              <line x1="238" y1="244" x2="238" y2="266"/>
              <line x1="632" y1="118" x2="632" y2="266"/>
            </g>
            <text x="24" y="286" fill="#7B9099" font-size="11">GND — continuous from battery to every probe; the switch is on the +12 V side only</text>
          </g>
        </svg>
