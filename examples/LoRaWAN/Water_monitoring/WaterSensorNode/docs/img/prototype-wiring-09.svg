<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img"
             aria-label="The I2C chain as built. Four shared nets leave the WaziSense board: SDA from pin A4, SCL from pin A5, permanent 3.3 volts from the D6 plus terminal, and the switched return to the D6 minus terminal. The EZO-EC takes all four directly, with no isolator. The pH channel instead runs through one Basic EZO inline voltage isolator: it takes SDA and SCL from the same nets, its MCU-side ground from the switched D6 minus return, and its supply from a separate branch off the battery through a Pololu 2810 MOSFET switch controlled by pin A1. Beyond the isolation barrier an isolated 3.9 volt supply and a floating ground feed the EZO-pH, whose probe connector carries PRB and PGND. The isolated ground is marked as a floating net that must never be bonded to board ground."><rect x="-10000" y="-10000" width="20000" height="20000" fill="#FFFFFF"/>
          <g font-family="IBM Plex Mono, monospace" font-size="12" fill="currentColor">

            <!-- ===== the board ===== -->
            <rect x="20" y="40" width="190" height="196" rx="2" fill="#EBF1F3" stroke="currentColor" stroke-width="1.4"/>
            <text x="34" y="64" font-family="IBM Plex Sans Condensed, sans-serif" font-size="13" font-weight="700" fill="#15242A">WaziSense v2</text>
            <text x="202" y="108" text-anchor="end" fill="#6D3BD1">A4  SDA</text>
            <text x="202" y="134" text-anchor="end" fill="#6D3BD1">A5  SCL</text>
            <text x="202" y="160" text-anchor="end" fill="#0D6E88">D6(+)  3.3 V</text>
            <text x="202" y="186" text-anchor="end" fill="#485D67">D6(&#8722;)  return</text>
            <text x="202" y="212" text-anchor="end" fill="#B45F09">A1  pin</text>

            <!-- ===== four shared nets ===== -->
            <line x1="210" y1="104" x2="900" y2="104" stroke="#6D3BD1" stroke-width="2"/>
            <line x1="210" y1="130" x2="900" y2="130" stroke="#6D3BD1" stroke-width="2"/>
            <line x1="210" y1="156" x2="900" y2="156" stroke="#0D6E88" stroke-width="2"/>
            <line x1="210" y1="182" x2="900" y2="182" stroke="#485D67" stroke-width="2"/>
            <text x="908" y="108" fill="#6D3BD1" font-size="10">SDA</text>
            <text x="908" y="134" fill="#6D3BD1" font-size="10">SCL</text>
            <text x="908" y="160" fill="#0D6E88" font-size="10">+3V3</text>
            <text x="908" y="186" fill="#485D67" font-size="10">RTN</text>

            <text x="300" y="72" fill="#A32C24" font-size="10">Pull-ups: A4/A5 to D6(+) must MEASURE ~4.7 k&#937;.</text>
            <text x="300" y="86" fill="#A32C24" font-size="10">I2C_J is documented closed and was found OPEN — 5.9 M&#937;.</text>

            <!-- ===== battery branch for the isolator ===== -->
            <text x="20" y="286" fill="#B45F09" font-size="11">+VBATT (X1-1)</text>
            <line x1="20" y1="300" x2="70" y2="300" stroke="#B45F09" stroke-width="2"/>
            <rect x="70" y="276" width="150" height="48" rx="2" fill="#FFFFFF" stroke="currentColor" stroke-width="1.4"/>
            <text x="145" y="296" text-anchor="middle" font-size="11">Pololu #2810</text>
            <text x="145" y="312" text-anchor="middle" fill="#7B9099" font-size="10">on the cell side</text>
            <line x1="220" y1="300" x2="330" y2="300" stroke="#B45F09" stroke-width="2"/>
            <text x="238" y="292" fill="#B45F09" font-size="10">3.0–5.0 V in</text>

            <!-- D5 into the switch's ON pin -->
            <path d="M 210 208 L 248 208 L 248 252 L 145 252 L 145 276" fill="none"
                  stroke="#B45F09" stroke-width="1.6" stroke-dasharray="5 4"/>
            <text x="150" y="246" fill="#B45F09" font-size="10">A1 → ON (only for the reads)</text>

            <!-- ===== the isolator ===== -->
            <rect x="330" y="252" width="210" height="150" rx="2" stroke="currentColor" stroke-width="1.4" fill="none"/>
            <text x="435" y="276" text-anchor="middle">Isolator · pH</text>
            <text x="435" y="292" text-anchor="middle" fill="#7B9099" font-size="10">ADM3260 · 3.9 V out</text>
            <line x1="330" y1="330" x2="540" y2="330" stroke="#A32C24" stroke-width="1.6" stroke-dasharray="7 5"/>
            <text x="548" y="334" fill="#A32C24" font-size="10">isolation barrier</text>
            <text x="435" y="358" text-anchor="middle" fill="#7B9099" font-size="10">isolated side</text>
            <text x="435" y="378" text-anchor="middle" font-size="9">3.9 V &#183; GND &#183; data A &#183; data B</text>

            <!-- data drops into the isolator -->
            <line x1="366" y1="104" x2="366" y2="252" stroke="#6D3BD1" stroke-width="1.6"/>
            <line x1="396" y1="130" x2="396" y2="252" stroke="#6D3BD1" stroke-width="1.6"/>
            <circle cx="366" cy="104" r="3.5" fill="#6D3BD1"/>
            <circle cx="396" cy="130" r="3.5" fill="#6D3BD1"/>

            <!-- MCU-side ground of the isolator: the switched return D6(-), NOT board GND -->
            <line x1="500" y1="252" x2="500" y2="182" stroke="#485D67" stroke-width="1.8"/>
            <circle cx="500" cy="182" r="3.5" fill="#485D67"/>
            <text x="506" y="204" fill="#485D67" font-size="9">MCU-side GND → RTN = D6(−)</text>
            <text x="506" y="216" fill="#A32C24" font-size="9">on X1-2 instead it costs 0.4 mA — measured</text>

            <!-- ===== EZO-pH ===== -->
            <line x1="366" y1="402" x2="366" y2="440" stroke="#6D3BD1" stroke-width="1.6"/>
            <line x1="396" y1="402" x2="396" y2="440" stroke="#6D3BD1" stroke-width="1.6"/>
            <line x1="462" y1="402" x2="462" y2="440" stroke="#0D6E88" stroke-width="1.6"/>
            <line x1="500" y1="402" x2="500" y2="440" stroke="#7B9099" stroke-width="1.6"/>
            <line x1="500" y1="424" x2="548" y2="424" stroke="#A32C24" stroke-width="1.3"/>
            <circle cx="554" cy="424" r="4" fill="none" stroke="#A32C24" stroke-width="1.4"/>
            <text x="562" y="428" fill="#A32C24" font-size="9">ISO_GND floats</text>

            <rect x="330" y="440" width="210" height="80" rx="2" fill="#EBF1F3" stroke="currentColor" stroke-width="1.4"/>
            <text x="435" y="470" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="14" font-weight="700" fill="#15242A">EZO-pH</text>
            <text x="435" y="490" text-anchor="middle" fill="#7B9099" font-size="11">I&#178;C 0x63 · pins TX / RX</text>
            <text x="435" y="509" text-anchor="middle" fill="#7B9099" font-size="9">~1 s boot · 900 ms per read</text>

            <line x1="435" y1="520" x2="435" y2="556" stroke="currentColor" stroke-width="1.8"/>
            <rect x="421" y="556" width="28" height="16" rx="2" stroke="currentColor" stroke-width="1.4" fill="none"/>
            <text x="435" y="590" text-anchor="middle" font-size="10">pH probe · PRB + PGND</text>
            <text x="435" y="604" text-anchor="middle" fill="#7B9099" font-size="9">PGND is the reference electrode, not a ground</text>

            <!-- ===== the EC channel: a second isolator, fitted but not required ===== -->
            <line x1="540" y1="300" x2="660" y2="300" stroke="#B45F09" stroke-width="2" stroke-dasharray="6 4"/>
            <line x1="700" y1="104" x2="700" y2="252" stroke="#6D3BD1" stroke-width="1.6"/>
            <line x1="730" y1="130" x2="730" y2="252" stroke="#6D3BD1" stroke-width="1.6"/>
            <circle cx="700" cy="104" r="3.5" fill="#6D3BD1"/>
            <circle cx="730" cy="130" r="3.5" fill="#6D3BD1"/>

            <rect x="660" y="252" width="210" height="150" rx="2" stroke="currentColor" stroke-width="1.4"
                  fill="none" stroke-dasharray="5 3"/>
            <text x="765" y="276" text-anchor="middle">Isolator · EC</text>
            <text x="765" y="292" text-anchor="middle" fill="#B45F09" font-size="10">fitted — not required</text>
            <line x1="660" y1="330" x2="870" y2="330" stroke="#A32C24" stroke-width="1.6" stroke-dasharray="7 5"/>
            <text x="765" y="358" text-anchor="middle" fill="#7B9099" font-size="10">isolated side</text>
            <text x="765" y="378" text-anchor="middle" font-size="9">3.9 V &#183; GND &#183; data A &#183; data B</text>

            <line x1="830" y1="252" x2="830" y2="182" stroke="#485D67" stroke-width="1.8"/>
            <circle cx="830" cy="182" r="3.5" fill="#485D67"/>

            <line x1="700" y1="402" x2="700" y2="440" stroke="#6D3BD1" stroke-width="1.6"/>
            <line x1="730" y1="402" x2="730" y2="440" stroke="#6D3BD1" stroke-width="1.6"/>
            <line x1="792" y1="402" x2="792" y2="440" stroke="#0D6E88" stroke-width="1.6"/>
            <line x1="830" y1="402" x2="830" y2="440" stroke="#7B9099" stroke-width="1.6"/>

            <rect x="660" y="440" width="210" height="80" rx="2" fill="#EBF1F3" stroke="currentColor" stroke-width="1.4"/>
            <text x="765" y="470" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="14" font-weight="700" fill="#15242A">EZO-EC</text>
            <text x="765" y="490" text-anchor="middle" fill="#7B9099" font-size="11">I&#178;C 0x64 · pins TX / RX</text>
            <text x="765" y="509" text-anchor="middle" fill="#7B9099" font-size="9">needs K,1.0 then Cal,dry to read at all</text>

            <g stroke="currentColor" stroke-width="1.8">
              <line x1="740" y1="520" x2="740" y2="566"/>
              <line x1="790" y1="520" x2="790" y2="566"/>
            </g>
            <text x="765" y="590" text-anchor="middle" font-size="10">EC probe ENV-40-EC-K1.0</text>
            <text x="765" y="604" text-anchor="middle" fill="#7B9099" font-size="9">two leads, not polarised</text>

            <text x="908" y="160" fill="#0D6E88" font-size="9">→ transceiver,</text>
            <text x="908" y="172" fill="#0D6E88" font-size="9">DS18B20, bias</text>

            <!-- ===== board ground rail ===== -->
            <line x1="20" y1="596" x2="900" y2="596" stroke="#7B9099" stroke-width="2.6"/>
            <line x1="145" y1="324" x2="145" y2="596" stroke="#7B9099" stroke-width="1.6"/>
            <text x="20" y="622" fill="#7B9099" font-size="10">X1-2 board ground. The RTN net above is <tspan fill="#A32C24">not</tspan> this node — it is the switched return, and bridging the two shorts out the D6 MOSFET.</text>
          </g>
        </svg>
