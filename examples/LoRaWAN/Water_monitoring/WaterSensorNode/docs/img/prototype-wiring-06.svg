<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img"
             aria-label="Full power schematic in classic symbols. A photovoltaic panel feeds a charge controller with separate positive and negative wires, with a transient suppressor to ground on the positive line. The battery hangs between the positive node and ground. In series follow a PTC fuse and an SS34 diode to the VBATT rail, which carries a second transient suppressor to ground. VBATT feeds the WaziSense board and, on a lower branch, a Pololu number 2810 MOSFET switch controlled by pin D5, then a U3V9F12 boost converter, a 1000 microfarad capacitor, and the plus 12 volt switched rail. All negative conductors run to one ground rail."><rect x="-10000" y="-10000" width="20000" height="20000" fill="#FFFFFF"/>
          <g font-family="IBM Plex Mono, monospace" font-size="11" fill="currentColor">

            <!-- ===== PV panel symbol ===== -->
            <rect x="40" y="68" width="78" height="58" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <g stroke="currentColor" stroke-width="1">
              <line x1="58"  y1="126" x2="78"  y2="68"/>
              <line x1="78"  y1="126" x2="98"  y2="68"/>
              <line x1="98"  y1="126" x2="118" y2="68"/>
            </g>
            <g stroke="#B45F09" stroke-width="1.3">
              <line x1="18" y1="46" x2="40" y2="62"/>
              <line x1="36" y1="42" x2="54" y2="60"/>
            </g>
            <text x="79" y="146" text-anchor="middle" fill="#7B9099" font-size="10">Solar 6 V</text>

            <!-- PV to charge controller -->
            <line x1="118" y1="86"  x2="180" y2="86"  stroke="#B45F09" stroke-width="2"/>
            <line x1="118" y1="112" x2="180" y2="112" stroke="#7B9099" stroke-width="2"/>
            <text x="132" y="80" fill="#B45F09" font-size="10">+</text>
            <text x="132" y="126" fill="#7B9099" font-size="10">−</text>

            <rect x="180" y="68" width="118" height="58" rx="2" fill="#EBF1F3" stroke="currentColor" stroke-width="1.5"/>
            <text x="239" y="92"  text-anchor="middle" font-size="11">Charge ctrl</text>
            <text x="239" y="108" text-anchor="middle" fill="#7B9099" font-size="10">MPPT module</text>

            <!-- solar TVS -->
            <circle cx="150" cy="86" r="3.5" fill="#B45F09"/>
            <line x1="150" y1="86" x2="150" y2="180" stroke="#B45F09" stroke-width="1.6"/>
            <path d="M 136 172 L 136 180 L 164 180 L 164 188" fill="none" stroke="currentColor" stroke-width="2"/>
            <polygon points="140,200 160,200 150,180" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <line x1="150" y1="200" x2="150" y2="500" stroke="#7B9099" stroke-width="1.6"/>
            <text x="172" y="186" font-size="10">TVS</text>
            <text x="172" y="199" fill="#7B9099" font-size="9">solar input</text>

            <!-- controller out -->
            <line x1="298" y1="86"  x2="360" y2="86"  stroke="#B45F09" stroke-width="2"/>
            <line x1="298" y1="112" x2="325" y2="112" stroke="#7B9099" stroke-width="2"/>
            <line x1="325" y1="112" x2="325" y2="500" stroke="#7B9099" stroke-width="1.6"/>
            <text x="308" y="80" fill="#B45F09" font-size="10">+</text>
            <text x="331" y="130" fill="#7B9099" font-size="10">−</text>

            <!-- ===== battery ===== -->
            <circle cx="360" cy="86" r="3.5" fill="#B45F09"/>
            <line x1="360" y1="86" x2="360" y2="140" stroke="#B45F09" stroke-width="2"/>
            <g stroke="currentColor" stroke-width="2">
              <line x1="342" y1="140" x2="378" y2="140"/>
              <line x1="350" y1="150" x2="370" y2="150"/>
              <line x1="342" y1="160" x2="378" y2="160"/>
              <line x1="350" y1="170" x2="370" y2="170"/>
            </g>
            <line x1="360" y1="170" x2="360" y2="500" stroke="#7B9099" stroke-width="1.6"/>
            <text x="384" y="138" fill="#B45F09" font-size="12">+</text>
            <text x="384" y="176" fill="#7B9099" font-size="12">−</text>
            <text x="392" y="200" fill="#7B9099" font-size="10">18650 1–2× ∥</text>

            <!-- ===== PTC + SS34 in series ===== -->
            <line x1="360" y1="86" x2="410" y2="86" stroke="#B45F09" stroke-width="2"/>
            <rect x="410" y="76" width="44" height="20" rx="1" fill="#FFFFFF" stroke="currentColor" stroke-width="1.5"/>
            <line x1="415" y1="93" x2="449" y2="79" stroke="currentColor" stroke-width="1.5"/>
            <text x="432" y="66" text-anchor="middle" font-size="10">PTC</text>

            <line x1="454" y1="86" x2="500" y2="86" stroke="#B45F09" stroke-width="2"/>
            <polygon points="500,75 500,97 520,86" fill="none" stroke="currentColor" stroke-width="1.7"/>
            <line x1="520" y1="73" x2="520" y2="99" stroke="currentColor" stroke-width="2.2"/>
            <text x="510" y="64" text-anchor="middle" font-size="10">SS34</text>

            <!-- VBATT node + rail -->
            <line x1="520" y1="86" x2="940" y2="86" stroke="#B45F09" stroke-width="2"/>
            <circle cx="580" cy="86" r="3.5" fill="#B45F09"/>
            <text x="800" y="76" fill="#B45F09" font-size="11">+VBATT  (X1-1)</text>

            <!-- VBATT TVS -->
            <line x1="580" y1="86" x2="580" y2="170" stroke="#B45F09" stroke-width="1.6"/>
            <path d="M 566 162 L 566 170 L 594 170 L 594 178" fill="none" stroke="currentColor" stroke-width="2"/>
            <polygon points="570,190 590,190 580,170" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <line x1="580" y1="190" x2="580" y2="500" stroke="#7B9099" stroke-width="1.6"/>
            <text x="602" y="176" font-size="10">SMBJ5.0A</text>

            <!-- ===== board ===== -->
            <circle cx="688" cy="86" r="3.5" fill="#B45F09"/>
            <path d="M 688 86 L 688 175 L 700 175" fill="none" stroke="#B45F09" stroke-width="2"/>
            <rect x="700" y="150" width="240" height="92" rx="2" fill="#EBF1F3" stroke="currentColor" stroke-width="1.5"/>
            <text x="714" y="172" font-family="IBM Plex Sans Condensed, sans-serif" font-size="13" font-weight="700" fill="#15242A">WaziSenseV2</text>
            <text x="714" y="192" fill="#7B9099" font-size="10">VIN · GND · SP1 (D6) · A0 · SP2 unused</text>
            <text x="694" y="170" text-anchor="end" fill="#B45F09" font-size="9">VIN</text>
            <line x1="820" y1="242" x2="820" y2="500" stroke="#7B9099" stroke-width="1.6"/>
            <text x="826" y="262" fill="#7B9099" font-size="10">− GND</text>
            <line x1="940" y1="215" x2="972" y2="215" stroke="#0D6E88" stroke-width="2"/>
            <text x="946" y="208" fill="#0D6E88" font-size="9">SP1 +3V3 sw → D6(+)</text>

            <!-- ===== boost branch ===== -->
            <circle cx="640" cy="86" r="3.5" fill="#B45F09"/>
            <path d="M 640 86 L 640 330 L 120 330 L 120 380" fill="none" stroke="#B45F09" stroke-width="2"/>
            <text x="400" y="324" fill="#B45F09" font-size="10">+VBATT to boost</text>

            <rect x="120" y="362" width="116" height="56" rx="2" fill="#EBF1F3" stroke="currentColor" stroke-width="1.5"/>
            <text x="178" y="384" text-anchor="middle" font-size="11">#2810 (A)</text>
            <text x="178" y="399" text-anchor="middle" fill="#7B9099" font-size="10">high-side switch</text>
            <line x1="178" y1="418" x2="178" y2="500" stroke="#7B9099" stroke-width="1.6"/>
            <text x="184" y="440" fill="#7B9099" font-size="10">−</text>

            <line x1="236" y1="380" x2="290" y2="380" stroke="#B45F09" stroke-width="2"/>
            <rect x="290" y="362" width="126" height="56" rx="2" fill="#EBF1F3" stroke="currentColor" stroke-width="1.5"/>
            <text x="353" y="384" text-anchor="middle" font-size="11">U3V9F12</text>
            <text x="353" y="399" text-anchor="middle" fill="#7B9099" font-size="10">→ 12 V fixed</text>
            <line x1="353" y1="418" x2="353" y2="500" stroke="#7B9099" stroke-width="1.6"/>
            <text x="359" y="440" fill="#7B9099" font-size="10">−</text>

            <!-- 12 V rail -->
            <line x1="416" y1="380" x2="940" y2="380" stroke="#B45F09" stroke-width="2.4"/>
            <circle cx="480" cy="380" r="3.5" fill="#B45F09"/>
            <text x="700" y="370" fill="#B45F09" font-size="11">+12 V switched  (X2-1) → probes</text>

            <!-- bulk capacitor, polarised -->
            <circle cx="540" cy="380" r="3.5" fill="#B45F09"/>
            <line x1="540" y1="380" x2="540" y2="410" stroke="#B45F09" stroke-width="1.6"/>
            <line x1="522" y1="410" x2="558" y2="410" stroke="currentColor" stroke-width="2.2"/>
            <path d="M 522 422 Q 540 431 558 422" fill="none" stroke="currentColor" stroke-width="2.2"/>
            <line x1="540" y1="426" x2="540" y2="500" stroke="#7B9099" stroke-width="1.6"/>
            <text x="514" y="404" text-anchor="end" fill="#B45F09" font-size="11">+</text>
            <text x="566" y="412" font-size="10">1000 µF</text>
            <text x="566" y="425" fill="#7B9099" font-size="9">25 V, polarised</text>

            <!-- 12 V rail control: D5 straight into the #2810 ON pin -->
            <line x1="750" y1="242" x2="750" y2="300" stroke="#0D6E88" stroke-width="1.6"/>
            <line x1="750" y1="300" x2="300" y2="300" stroke="#0D6E88" stroke-width="1.6"/>
            <circle cx="340" cy="300" r="3.5" fill="#0D6E88"/>
            <line x1="340" y1="300" x2="340" y2="362" stroke="#0D6E88" stroke-width="1.6"/>
            <text x="560" y="292" fill="#0D6E88" font-size="10">D5 → #2810 ON</text>

            <text x="116" y="296" fill="#7B9099" font-size="9">ON has an internal pull-down — low or open both mean off</text>
            <text x="116" y="308" fill="#A32C24" font-size="9">the module's slide switch must be OFF, or it overrides ON</text>

            <!-- ===== ground rail ===== -->
            <line x1="40" y1="500" x2="940" y2="500" stroke="#7B9099" stroke-width="3"/>
            <line x1="660" y1="500" x2="660" y2="518" stroke="#7B9099" stroke-width="2"/>
            <g stroke="#7B9099" stroke-width="2.2">
              <line x1="644" y1="518" x2="676" y2="518"/>
              <line x1="650" y1="525" x2="670" y2="525"/>
              <line x1="656" y1="532" x2="664" y2="532"/>
            </g>
            <text x="40" y="548" fill="#7B9099" font-size="10">GND / X1-2 — every negative conductor lands here. Star-point at the battery minus.</text>
          </g>
        </svg>
