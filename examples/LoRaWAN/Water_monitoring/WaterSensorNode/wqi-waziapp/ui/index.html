<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Water Quality Index</title>
<style>
  :root {
    --bg: #f4f7f6; --card: #ffffff; --text: #1d2a33; --muted: #6b7a85;
    --housing: #2b3238; --off: #3d464d;
    --red: #e5484d; --amber: #f5a524; --green: #30a46c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14181b; --card: #1d2327; --text: #e6ecef; --muted: #8f9ca5;
            --housing: #0d1012; --off: #262d32; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: var(--bg); color: var(--text);
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { background: var(--card); border-radius: 16px; padding: 28px 36px;
          display: flex; align-items: center; gap: 40px;
          box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  .light { background: var(--housing); border-radius: 28px; padding: 14px;
           display: flex; flex-direction: column; gap: 12px; }
  .lamp { width: 64px; height: 64px; border-radius: 50%; background: var(--off);
          transition: background .3s, box-shadow .3s; }
  .lamp.on.red   { background: var(--red);   box-shadow: 0 0 24px var(--red); }
  .lamp.on.amber { background: var(--amber); box-shadow: 0 0 24px var(--amber); }
  .lamp.on.green { background: var(--green); box-shadow: 0 0 24px var(--green); }
  .label { font-size: 14px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  .value { font-size: 72px; font-weight: 700; line-height: 1; margin: 6px 0;
           font-variant-numeric: tabular-nums; }
  .category { font-size: 22px; font-weight: 600; }
  .meta { margin-top: 14px; font-size: 13px; color: var(--muted); }
  @media (max-width: 480px) {
    .card { flex-direction: column; gap: 20px; padding: 24px 16px; margin: 0 16px; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="light" aria-hidden="true">
      <div class="lamp red"   id="lamp-red"></div>
      <div class="lamp amber" id="lamp-amber"></div>
      <div class="lamp green" id="lamp-green"></div>
    </div>
    <div>
      <div class="label">Water Quality Index</div>
      <div class="value" id="value">…</div>
      <div class="category" id="category">loading</div>
      <div class="meta" id="meta"></div>
    </div>
  </div>
<script>
  // Relative on purpose: the dashboard shows this page under
  // /apps/kijanispace.wqi/ui/, and the API sits next to it.
  const API = "../api/wqi";
  const REFRESH_MS = 5 * 60 * 1000;

  function show(r) {
    for (const c of ["red", "amber", "green"])
      document.getElementById("lamp-" + c).classList.toggle("on", r.light === c);
    const value = document.getElementById("value");
    const cat = document.getElementById("category");
    const meta = document.getElementById("meta");
    if (r.error) {
      value.textContent = "–"; cat.textContent = "No value"; meta.textContent = r.error;
      return;
    }
    value.textContent = r.wqi === null ? "–" : r.wqi.toFixed(0);
    cat.textContent = r.category;
    const when = new Date(r.computed).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
    meta.textContent = r.wqi === null
      ? `${r.device} · no data in the last ${r.window_hours} h`
      : `${r.device} · last ${r.window_hours} h · ${r.tests} measurements · ${when}`
        + (r.reliable ? "" : " · too few values for a reliable index");
  }

  async function load() {
    try {
      const resp = await fetch(API, {cache: "no-store"});
      show(await resp.json());
    } catch (e) {
      show({error: "gateway not reachable"});
    }
  }
  load();
  setInterval(load, REFRESH_MS);
</script>
</body>
</html>
