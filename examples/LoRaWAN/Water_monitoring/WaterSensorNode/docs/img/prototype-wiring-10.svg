<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img"
             aria-label="The non-isolated variant. Both EZO circuits connect directly to board pins A4 and A5 and to the D6(+) and X1-2 supply terminals, with no isolation barrier anywhere. A closed interference loop is highlighted in red and numbered in four steps: the EC electrodes drive alternating current into the water, that current spreads through the water past the pH cell, the pH reference electrode sits inside the resulting field so the error enters the pH measurement there, and the loop closes back through the ground that both circuits share. A ghosted dotted line marks where the isolation barrier of Drawing 08 would have sat."><rect x="-10000" y="-10000" width="20000" height="20000" fill="#FFFFFF"/>
          <defs>
            <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#A32C24"/>
            </marker>
          </defs>

          <g font-family="IBM Plex Mono, monospace" font-size="12" fill="currentColor">

            <!-- ===== source: board + X3 ===== -->
            <rect x="20" y="44" width="180" height="164" rx="2" fill="#EBF1F3" stroke="currentColor" stroke-width="1.4"/>
            <text x="34" y="68" font-family="IBM Plex Sans Condensed, sans-serif" font-size="13" font-weight="700" fill="#15242A">WaziSense v2</text>
            <text x="34" y="84" fill="#7B9099" font-size="10">+ X3 terminal block</text>
            <text x="192" y="116" text-anchor="end" fill="#6D3BD1">A4  SDA</text>
            <text x="192" y="144" text-anchor="end" fill="#6D3BD1">A5  SCL</text>
            <text x="192" y="172" text-anchor="end" fill="#0D6E88">D6(+)  +3V3 sw</text>
            <text x="192" y="200" text-anchor="end" fill="#A32C24">X1-2  GND</text>

            <!-- ===== the four shared nets ===== -->
            <line x1="200" y1="112" x2="880" y2="112" stroke="#6D3BD1" stroke-width="2"/>
            <line x1="200" y1="140" x2="880" y2="140" stroke="#6D3BD1" stroke-width="2"/>
            <line x1="200" y1="168" x2="880" y2="168" stroke="#0D6E88" stroke-width="2"/>
            <line x1="200" y1="196" x2="880" y2="196" stroke="#7B9099" stroke-width="2"/>
            <text x="886" y="116" fill="#6D3BD1" font-size="10">SDA</text>
            <text x="886" y="144" fill="#6D3BD1" font-size="10">SCL</text>
            <text x="886" y="172" fill="#0D6E88" font-size="10">+3V3</text>
            <text x="886" y="200" fill="#7B9099" font-size="10">GND</text>

            <!-- ===== the shared ground carries the return current ===== -->
            <line x1="802" y1="196" x2="466" y2="196" stroke="#A32C24" stroke-width="3.4" marker-end="url(#arw)"/>
            <text x="634" y="186" text-anchor="middle" fill="#A32C24" font-size="10">return current — both circuits share this node</text>

            <!-- ===== drops to EZO-pH ===== -->
            <g stroke="#6D3BD1" stroke-width="1.6">
              <line x1="320" y1="112" x2="320" y2="250"/>
              <line x1="350" y1="140" x2="350" y2="250"/>
            </g>
            <line x1="430" y1="168" x2="430" y2="250" stroke="#0D6E88" stroke-width="1.6"/>
            <line x1="462" y1="196" x2="462" y2="250" stroke="#A32C24" stroke-width="2.2"/>
            <circle cx="320" cy="112" r="3.5" fill="#6D3BD1"/>
            <circle cx="350" cy="140" r="3.5" fill="#6D3BD1"/>
            <circle cx="430" cy="168" r="3.5" fill="#0D6E88"/>
            <circle cx="462" cy="196" r="3.5" fill="#A32C24"/>

            <!-- ===== drops to EZO-EC ===== -->
            <g stroke="#6D3BD1" stroke-width="1.6">
              <line x1="660" y1="112" x2="660" y2="250"/>
              <line x1="690" y1="140" x2="690" y2="250"/>
            </g>
            <line x1="770" y1="168" x2="770" y2="250" stroke="#0D6E88" stroke-width="1.6"/>
            <line x1="802" y1="196" x2="802" y2="250" stroke="#A32C24" stroke-width="2.2"/>
            <circle cx="660" cy="112" r="3.5" fill="#6D3BD1"/>
            <circle cx="690" cy="140" r="3.5" fill="#6D3BD1"/>
            <circle cx="770" cy="168" r="3.5" fill="#0D6E88"/>
            <circle cx="802" cy="196" r="3.5" fill="#A32C24"/>

            <!-- ===== where the barrier would have been ===== -->
            <line x1="280" y1="228" x2="850" y2="228" stroke="#7B9099" stroke-width="1.2" stroke-dasharray="2 6"/>
            <text x="565" y="222" text-anchor="middle" fill="#7B9099" font-size="10">the isolation barrier of Drawing 08 would sit here — there is none</text>

            <!-- ===== EZO circuits ===== -->
            <rect x="300" y="250" width="190" height="94" rx="2" fill="#EBF1F3" stroke="currentColor" stroke-width="1.4"/>
            <text x="395" y="280" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="14" font-weight="700" fill="#15242A">EZO-pH</text>
            <text x="395" y="300" text-anchor="middle" fill="#7B9099" font-size="11">I²C 0x63</text>
            <text x="395" y="320" text-anchor="middle" fill="#A32C24" font-size="10">GND = X1-2</text>
            <text x="395" y="337" text-anchor="middle" fill="#7B9099" font-size="9">read this one first</text>

            <rect x="640" y="250" width="190" height="94" rx="2" fill="#EBF1F3" stroke="currentColor" stroke-width="1.4"/>
            <text x="735" y="280" text-anchor="middle" font-family="IBM Plex Sans Condensed, sans-serif" font-size="14" font-weight="700" fill="#15242A">EZO-EC</text>
            <text x="735" y="300" text-anchor="middle" fill="#7B9099" font-size="11">I²C 0x64</text>
            <text x="735" y="320" text-anchor="middle" fill="#A32C24" font-size="10">GND = X1-2</text>
            <text x="735" y="337" text-anchor="middle" fill="#7B9099" font-size="9">asleep while pH is read</text>

            <!-- ===== probe leads ===== -->
            <line x1="395" y1="344" x2="395" y2="440" stroke="currentColor" stroke-width="1.8"/>
            <text x="404" y="380" fill="#7B9099" font-size="10">BNC: core + shell</text>
            <g stroke="currentColor" stroke-width="1.8">
              <line x1="718" y1="344" x2="718" y2="440"/>
              <line x1="752" y1="344" x2="752" y2="440"/>
            </g>
            <text x="762" y="380" fill="#7B9099" font-size="10">2 leads</text>

            <!-- ===== the water ===== -->
            <rect x="240" y="448" width="660" height="132" rx="4" fill="#EBF1F3" stroke="#0D6E88" stroke-width="1.2" stroke-dasharray="6 4"/>
            <text x="256" y="470" fill="#0D6E88" font-size="10">lake water · order 100 µS/cm — the shared conductor nobody draws</text>

            <!-- pH cell -->
            <line x1="395" y1="440" x2="395" y2="496" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="395" cy="505" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <text x="395" y="545" text-anchor="middle" font-size="10">pH glass + Ag/AgCl ref</text>

            <!-- EC cell -->
            <g stroke="currentColor" stroke-width="1.8">
              <line x1="718" y1="440" x2="718" y2="500"/>
              <line x1="752" y1="440" x2="752" y2="500"/>
            </g>
            <g stroke="currentColor" stroke-width="4">
              <line x1="718" y1="500" x2="718" y2="534"/>
              <line x1="752" y1="500" x2="752" y2="534"/>
            </g>
            <text x="735" y="556" text-anchor="middle" font-size="10">EC electrodes K=1.0</text>

            <!-- current through the water -->
            <path d="M 690 520 C 610 566, 500 566, 412 524" fill="none" stroke="#A32C24"
                  stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#arw)"/>

            <!-- ===== numbered steps ===== -->
            <g font-size="11" font-weight="700">
              <circle cx="782" cy="474" r="10" fill="#A32C24"/>
              <text x="782" y="478" text-anchor="middle" fill="#F6F9FA">1</text>
              <circle cx="556" cy="566" r="10" fill="#A32C24"/>
              <text x="556" y="570" text-anchor="middle" fill="#F6F9FA">2</text>
              <circle cx="356" cy="505" r="10" fill="#A32C24"/>
              <text x="356" y="509" text-anchor="middle" fill="#F6F9FA">3</text>
              <circle cx="634" cy="196" r="10" fill="#A32C24"/>
              <text x="634" y="200" text-anchor="middle" fill="#F6F9FA">4</text>
            </g>

            <!-- ===== step legend ===== -->
            <text x="20" y="614" fill="#A32C24" font-size="11">① EC drives AC into the water   ② the field spreads past the pH cell   ③ the reference electrode reads it as signal   ④ the loop closes through the shared GND</text>
            <text x="20" y="636" fill="#7B9099" font-size="10">Break the loop at any single point and the error goes away. One isolator on the pH channel is the cheapest place to break it.</text>
          </g>
        </svg>
