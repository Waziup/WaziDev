<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-label="Discrete high-side switch schematic. A P-channel MOSFET has its source on the protected battery rail and its drain feeding the load. A 100 kilohm resistor from gate to source holds it off. A 2N7002 N-channel MOSFET pulls the gate down when its own gate is driven high from the microcontroller through a 10 kilohm series resistor, with a 100 kilohm pulldown holding it off at boot. A 100 nanofarad capacitor from gate to source slows the turn-on to about ten milliseconds."><rect x="-10000" y="-10000" width="20000" height="20000" fill="#ffffff"/>
        <rect x="0" y="0" width="700" height="300" fill="none"/>

        <line x1="60" y1="48" x2="640" y2="48" stroke="#c0442e" stroke-width="2.4"/>
        <text x="60" y="38" font-size="12" fill="#c0442e" font-weight="600">+VBATT (after PTC / Q5)</text>

        <!-- P-FET -->
        <line x1="300" y1="48" x2="300" y2="96" stroke="#c0442e" stroke-width="2"/>
        <rect x="272" y="96" width="56" height="52" rx="3" fill="#eceae4" stroke="#23211d" stroke-width="1.6"/>
        <text x="300" y="118" text-anchor="middle" font-size="11" fill="#23211d" font-weight="600">Q1</text>
        <text x="300" y="134" text-anchor="middle" font-size="9.5" fill="#777166">AO3401A</text>
        <line x1="300" y1="148" x2="300" y2="196" stroke="#b07a10" stroke-width="2.4"/>
        <text x="312" y="176" font-size="12" fill="#b07a10" font-weight="600">to load</text>
        <text x="312" y="191" font-size="10" fill="#777166">U3V9F12 VIN, or the isolators</text>

        <!-- gate network -->
        <line x1="272" y1="122" x2="208" y2="122" stroke="#4a463f" stroke-width="1.6"/>
        <line x1="208" y1="122" x2="208" y2="48" stroke="#4a463f" stroke-width="1.6"/>
        <rect x="198" y="72" width="20" height="30" fill="#ffffff" stroke="#4a463f" stroke-width="1.4"/>
        <text x="186" y="92" text-anchor="end" font-size="11" fill="#4a463f">100 k&#937;</text>
        <circle cx="208" cy="48" r="3.5" fill="#c0442e"/>

        <!-- soft-start cap -->
        <line x1="208" y1="122" x2="152" y2="122" stroke="#4a463f" stroke-width="1.6"/>
        <line x1="152" y1="122" x2="152" y2="62" stroke="#4a463f" stroke-width="1.6"/>
        <line x1="140" y1="86" x2="164" y2="86" stroke="#23211d" stroke-width="2"/>
        <line x1="140" y1="94" x2="164" y2="94" stroke="#23211d" stroke-width="2"/>
        <text x="130" y="94" text-anchor="end" font-size="11" fill="#4a463f">100 nF</text>
        <circle cx="152" cy="62" r="0.1" fill="none"/>
        <line x1="152" y1="62" x2="152" y2="48" stroke="#4a463f" stroke-width="1.6"/>
        <circle cx="152" cy="48" r="3.5" fill="#c0442e"/>
        <circle cx="208" cy="122" r="3.5" fill="#4a463f"/>

        <!-- N-FET -->
        <line x1="208" y1="122" x2="208" y2="186" stroke="#4a463f" stroke-width="1.6"/>
        <rect x="180" y="186" width="56" height="48" rx="3" fill="#eceae4" stroke="#23211d" stroke-width="1.6"/>
        <text x="208" y="206" text-anchor="middle" font-size="11" fill="#23211d" font-weight="600">Q2</text>
        <text x="208" y="222" text-anchor="middle" font-size="9.5" fill="#777166">2N7002</text>
        <line x1="208" y1="234" x2="208" y2="262" stroke="#4a463f" stroke-width="1.6"/>
        <line x1="180" y1="262" x2="236" y2="262" stroke="#4a463f" stroke-width="2.2"/>
        <line x1="190" y1="268" x2="226" y2="268" stroke="#4a463f" stroke-width="2.2"/>
        <line x1="198" y1="274" x2="218" y2="274" stroke="#4a463f" stroke-width="2.2"/>
        <text x="248" y="270" font-size="11" fill="#777166">GND</text>

        <!-- drive -->
        <line x1="180" y1="210" x2="96" y2="210" stroke="#17786e" stroke-width="1.8"/>
        <rect x="106" y="200" width="30" height="20" fill="#ffffff" stroke="#4a463f" stroke-width="1.4"/>
        <text x="121" y="194" text-anchor="middle" font-size="10.5" fill="#4a463f">10 k&#937;</text>
        <line x1="96" y1="210" x2="60" y2="210" stroke="#17786e" stroke-width="1.8"/>
        <text x="56" y="214" text-anchor="end" font-size="12" fill="#17786e" font-weight="600">D5</text>
        <text x="56" y="230" text-anchor="end" font-size="10" fill="#777166">or A1</text>

        <line x1="96" y1="210" x2="96" y2="256" stroke="#4a463f" stroke-width="1.4"/>
        <rect x="86" y="222" width="20" height="26" fill="#ffffff" stroke="#4a463f" stroke-width="1.4"/>
        <text x="78" y="240" text-anchor="end" font-size="10.5" fill="#4a463f">100 k&#937;</text>
        <line x1="82" y1="256" x2="110" y2="256" stroke="#4a463f" stroke-width="2"/>
        <circle cx="96" cy="210" r="3.5" fill="#4a463f"/>

        <g font-size="11" fill="#777166">
          <text x="400" y="96">Boots OFF: the 100 k&#937; pull-down on Q2's gate holds it off</text>
          <text x="400" y="114">before the MCU has configured anything.</text>
          <text x="400" y="146">Soft start: 100 nF against 100 k&#937; turns Q1 on over</text>
          <text x="400" y="164">about 10 ms, so the U3V9F12's input capacitor is charged</text>
          <text x="400" y="182">by a rising resistance instead of a closing contact.</text>
          <text x="400" y="214">Fit one of these twice: once for the 12 V chain on D5,</text>
          <text x="400" y="232">once for the isolator supply on A1.</text>
        </g>
      </svg>
