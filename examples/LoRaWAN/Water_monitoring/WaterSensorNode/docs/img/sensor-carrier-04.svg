<svg viewBox="0 0 940 560" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-label="Schematic sheet A. The cell connects to terminal X1. Its positive goes through PTC F1 and, on the board as built, the ideal-diode MOSFET Q5 (drawn here as the Schottky D1 it replaced) to the VBATT net, with TVS D2 and capacitors C1 and C2 from VBATT to ground. VBATT feeds connector J6 to the WaziSense battery input, and two identical high-side switch stages. Each stage is a P-channel MOSFET with a 100 kilohm gate pull-up, a 100 nanofarad soft-start capacitor, and a 2N7002 pulling the gate down when driven from the microcontroller through 10 kilohm, with a 100 kilohm pulldown. Stage A is gated by D5 and feeds the U3V9F12 regulator which produces 12 volts with bulk capacitor C4. Stage B is gated by A1 and produces the ISO_VIN net."><rect x="-10000" y="-10000" width="20000" height="20000" fill="#ffffff"/>
        <rect width="940" height="560" fill="none"/>
        <g font-family="IBM Plex Mono, monospace" font-size="11" fill="#4a463f">

          <!-- cell + protection -->
          <rect x="16" y="40" width="74" height="44" rx="2" fill="#eceae4" stroke="#c0442e" stroke-width="1.6"/>
          <text x="53" y="58" text-anchor="middle" font-size="11" fill="#23211d">X1</text>
          <text x="53" y="74" text-anchor="middle" font-size="9.5">18650</text>

          <line x1="90" y1="54" x2="128" y2="54" stroke="#c0442e" stroke-width="2"/>
          <rect x="128" y="43" width="40" height="22" fill="#ffffff" stroke="currentColor" stroke-width="1.3"/>
          <line x1="133" y1="62" x2="163" y2="46" stroke="currentColor" stroke-width="1.3"/>
          <text x="148" y="34" text-anchor="middle" font-size="10">F1</text>
          <text x="148" y="80" text-anchor="middle" font-size="9">PTC 2.6 A</text>

          <line x1="168" y1="54" x2="206" y2="54" stroke="#c0442e" stroke-width="2"/>
          <polygon points="206,44 206,64 224,54" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <line x1="224" y1="42" x2="224" y2="66" stroke="currentColor" stroke-width="2"/>
          <text x="215" y="34" text-anchor="middle" font-size="10">D1</text>
          <text x="215" y="80" text-anchor="middle" font-size="9">SS34</text>

          <line x1="224" y1="54" x2="900" y2="54" stroke="#c0442e" stroke-width="2.2"/>
          <text x="700" y="44" fill="#c0442e" font-size="11" font-weight="600">+VBATT</text>

          <!-- TVS + caps -->
          <line x1="280" y1="54" x2="280" y2="104" stroke="#c0442e" stroke-width="1.5"/>
          <circle cx="280" cy="54" r="3" fill="#c0442e"/>
          <path d="M 268 96 L 268 104 L 292 104 L 292 112" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <polygon points="271,124 289,124 280,104" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <line x1="280" y1="124" x2="280" y2="188" stroke="#777166" stroke-width="1.5"/>
          <text x="298" y="110" font-size="10">D2  SMBJ5.0A</text>

          <line x1="348" y1="54" x2="348" y2="140" stroke="#c0442e" stroke-width="1.5"/>
          <circle cx="348" cy="54" r="3" fill="#c0442e"/>
          <line x1="334" y1="140" x2="362" y2="140" stroke="currentColor" stroke-width="2"/>
          <path d="M 334 150 Q 348 158 362 150" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="348" y1="154" x2="348" y2="188" stroke="#777166" stroke-width="1.5"/>
          <text x="368" y="146" font-size="10">C1  100 &#181;F</text>
          <line x1="412" y1="54" x2="412" y2="140" stroke="#c0442e" stroke-width="1.5"/>
          <circle cx="412" cy="54" r="3" fill="#c0442e"/>
          <line x1="400" y1="140" x2="424" y2="140" stroke="currentColor" stroke-width="2"/>
          <line x1="400" y1="148" x2="424" y2="148" stroke="currentColor" stroke-width="2"/>
          <line x1="412" y1="148" x2="412" y2="188" stroke="#777166" stroke-width="1.5"/>
          <text x="430" y="146" font-size="10">C2  100 nF</text>

          <!-- to WaziSense -->
          <line x1="490" y1="54" x2="490" y2="104" stroke="#c0442e" stroke-width="1.5"/>
          <circle cx="490" cy="54" r="3" fill="#c0442e"/>
          <rect x="452" y="104" width="76" height="34" rx="2" fill="#eceae4" stroke="currentColor" stroke-width="1.3"/>
          <text x="490" y="118" text-anchor="middle" font-size="10" fill="#23211d">J6</text>
          <text x="490" y="131" text-anchor="middle" font-size="8.5">BAT_IN</text>
          <line x1="490" y1="138" x2="490" y2="188" stroke="#777166" stroke-width="1.5"/>

          <!-- ============ switch A ============ -->
          <text x="596" y="118" font-size="11" font-weight="600" fill="#b07a10">high-side switch A &#8212; 12 V chain</text>
          <line x1="700" y1="54" x2="700" y2="140" stroke="#c0442e" stroke-width="1.8"/>
          <circle cx="700" cy="54" r="3" fill="#c0442e"/>
          <rect x="676" y="140" width="48" height="42" rx="2" fill="#eceae4" stroke="#23211d" stroke-width="1.4"/>
          <text x="700" y="157" text-anchor="middle" font-size="10" fill="#23211d">Q1</text>
          <text x="700" y="172" text-anchor="middle" font-size="8.5">AO3401A</text>
          <line x1="700" y1="182" x2="700" y2="214" stroke="#b07a10" stroke-width="2"/>
          <text x="710" y="202" fill="#b07a10" font-size="10">V12IN</text>

          <line x1="676" y1="161" x2="628" y2="161" stroke="currentColor" stroke-width="1.3"/>
          <line x1="628" y1="161" x2="628" y2="54" stroke="currentColor" stroke-width="1.3"/>
          <rect x="619" y="78" width="18" height="26" fill="#ffffff" stroke="currentColor" stroke-width="1.2"/>
          <text x="612" y="95" text-anchor="end" font-size="9">R1 100k</text>
          <circle cx="628" cy="54" r="3" fill="#c0442e"/>
          <line x1="628" y1="118" x2="596" y2="118" stroke="currentColor" stroke-width="1.2"/>
          <line x1="584" y1="110" x2="584" y2="126" stroke="currentColor" stroke-width="1.8"/>
          <line x1="592" y1="110" x2="592" y2="126" stroke="currentColor" stroke-width="1.8"/>
          <line x1="592" y1="118" x2="596" y2="118" stroke="currentColor" stroke-width="1.2"/>
          <line x1="584" y1="118" x2="560" y2="118" stroke="currentColor" stroke-width="1.2"/>
          <line x1="560" y1="118" x2="560" y2="54" stroke="currentColor" stroke-width="1.2"/>
          <circle cx="560" cy="54" r="3" fill="#c0442e"/>
          <text x="570" y="136" font-size="9">C3 100 nF soft start</text>

          <line x1="628" y1="161" x2="628" y2="236" stroke="currentColor" stroke-width="1.3"/>
          <circle cx="628" cy="161" r="3" fill="currentColor"/>
          <rect x="604" y="236" width="48" height="40" rx="2" fill="#eceae4" stroke="#23211d" stroke-width="1.4"/>
          <text x="628" y="252" text-anchor="middle" font-size="10" fill="#23211d">Q2</text>
          <text x="628" y="266" text-anchor="middle" font-size="8.5">2N7002</text>
          <line x1="628" y1="276" x2="628" y2="306" stroke="#777166" stroke-width="1.3"/>

          <line x1="604" y1="256" x2="536" y2="256" stroke="#17786e" stroke-width="1.4"/>
          <rect x="548" y="246" width="26" height="20" fill="#ffffff" stroke="currentColor" stroke-width="1.2"/>
          <text x="561" y="240" text-anchor="middle" font-size="9">R2 10k</text>
          <line x1="536" y1="256" x2="496" y2="256" stroke="#17786e" stroke-width="1.4"/>
          <text x="492" y="260" text-anchor="end" fill="#17786e" font-size="11" font-weight="600">D5</text>
          <line x1="536" y1="256" x2="536" y2="300" stroke="currentColor" stroke-width="1.2"/>
          <rect x="527" y="268" width="18" height="24" fill="#ffffff" stroke="currentColor" stroke-width="1.2"/>
          <text x="520" y="284" text-anchor="end" font-size="9">R3 100k</text>
          <line x1="536" y1="300" x2="536" y2="306" stroke="#777166" stroke-width="1.2"/>
          <circle cx="536" cy="256" r="3" fill="#17786e"/>

          <!-- U3V9F12 -->
          <rect x="652" y="214" width="96" height="46" rx="2" fill="#eceae4" stroke="currentColor" stroke-width="1.4"/>
          <text x="700" y="232" text-anchor="middle" font-size="10" fill="#23211d">U1  U3V9F12</text>
          <text x="700" y="247" text-anchor="middle" font-size="8.5">3=VIN 2=GND 1=VOUT</text>
          <line x1="748" y1="237" x2="810" y2="237" stroke="#b07a10" stroke-width="2.2"/>
          <text x="790" y="228" fill="#b07a10" font-size="11" font-weight="600">+12V</text>
          <line x1="700" y1="260" x2="700" y2="306" stroke="#777166" stroke-width="1.3"/>

          <line x1="810" y1="237" x2="810" y2="268" stroke="#b07a10" stroke-width="1.5"/>
          <line x1="796" y1="268" x2="824" y2="268" stroke="currentColor" stroke-width="2"/>
          <path d="M 796 278 Q 810 286 824 278" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="810" y1="282" x2="810" y2="306" stroke="#777166" stroke-width="1.3"/>
          <text x="830" y="274" font-size="10">C4 470 &#181;F</text>

          <!-- ============ switch B ============ -->
          <text x="120" y="368" font-size="11" font-weight="600" fill="#a83277">high-side switch B &#8212; isolators</text>
          <line x1="224" y1="54" x2="224" y2="390" stroke="#c0442e" stroke-width="1.5"/>
          <rect x="200" y="390" width="48" height="42" rx="2" fill="#eceae4" stroke="#23211d" stroke-width="1.4"/>
          <text x="224" y="407" text-anchor="middle" font-size="10" fill="#23211d">Q3</text>
          <text x="224" y="422" text-anchor="middle" font-size="8.5">AO3401A</text>
          <line x1="224" y1="432" x2="224" y2="476" stroke="#a83277" stroke-width="2.2"/>
          <text x="234" y="462" fill="#a83277" font-size="11" font-weight="600">ISO_VIN</text>

          <text x="276" y="398" font-size="9.5">R4 100k gate pull-up &#183; C5 100 nF soft start</text>
          <text x="276" y="414" font-size="9.5">Q4 2N7002 &#183; R5 10k from A1 &#183; R6 100k pull-down</text>
          <text x="276" y="430" font-size="9.5">identical to stage A, gated by</text>
          <text x="432" y="430" fill="#17786e" font-size="11" font-weight="600">A1</text>

          <!-- ground rail -->
          <line x1="16" y1="306" x2="900" y2="306" stroke="#777166" stroke-width="2.4"/>
          <line x1="53" y1="84" x2="53" y2="306" stroke="#777166" stroke-width="1.5"/>
          <line x1="224" y1="306" x2="224" y2="306" stroke="#777166" stroke-width="1.5"/>
          <text x="20" y="326" fill="#777166" font-size="10">GND &#8212; the permanent ground. Note it is NOT the island on Sheet B.</text>
        </g>
      </svg>
