<svg viewBox="0 0 940 520" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-label="Schematic sheet B. Connector J2 brings in the permanently live 3V3P from the Sensor Power plus terminal and SWGND from the minus terminal. 3V3P feeds either a link JP1 or the MCP1700 regulator U2, producing 3V3REG. 3V3REG supplies the MAX3485 module, the 4.7 kilohm one-wire pull-up R9, the 680 ohm bias pull-up R7, and capacitors C8, C9 and C10 which return to the main ground. The MAX3485 ground, the 680 ohm bias pull-down R8 and the DS18B20 ground all return to SWGND instead. The RS485 A and B lines carry a single 120 ohm terminator and run to two four-way probe terminals which also carry 12 volts and the main ground."><rect x="-10000" y="-10000" width="20000" height="20000" fill="#ffffff"/>
        <rect width="940" height="520" fill="none"/>
        <g font-family="IBM Plex Mono, monospace" font-size="11" fill="#4a463f">

          <rect x="16" y="40" width="80" height="62" rx="2" fill="#eceae4" stroke="currentColor" stroke-width="1.4"/>
          <text x="56" y="58" text-anchor="middle" font-size="10" fill="#23211d">J2</text>
          <text x="56" y="72" text-anchor="middle" font-size="8.5">SW_1</text>
          <text x="56" y="86" text-anchor="middle" font-size="8">1=3V3P</text>
          <text x="56" y="97" text-anchor="middle" font-size="8">2=SWGND</text>

          <!-- 3V3P -> LDO or link -->
          <line x1="96" y1="58" x2="150" y2="58" stroke="#17786e" stroke-width="2"/>
          <text x="100" y="50" fill="#17786e" font-size="10">3V3P</text>
          <rect x="150" y="40" width="92" height="42" rx="2" fill="#eceae4" stroke="currentColor" stroke-width="1.4"/>
          <text x="196" y="57" text-anchor="middle" font-size="10" fill="#23211d">U2 MCP1700</text>
          <text x="196" y="71" text-anchor="middle" font-size="8.5">or JP1 link</text>
          <line x1="242" y1="58" x2="900" y2="58" stroke="#17786e" stroke-width="2.2"/>
          <text x="760" y="50" fill="#17786e" font-size="11" font-weight="600">3V3REG</text>

          <!-- caps to real ground -->
          <g stroke="currentColor" stroke-width="1.3">
            <line x1="292" y1="58" x2="292" y2="112"/><line x1="340" y1="58" x2="340" y2="112"/><line x1="388" y1="58" x2="388" y2="112"/>
          </g>
          <g fill="#17786e"><circle cx="292" cy="58" r="3"/><circle cx="340" cy="58" r="3"/><circle cx="388" cy="58" r="3"/></g>
          <g stroke="currentColor" stroke-width="2">
            <line x1="280" y1="112" x2="304" y2="112"/><line x1="280" y1="120" x2="304" y2="120"/>
            <line x1="328" y1="112" x2="352" y2="112"/><line x1="328" y1="120" x2="352" y2="120"/>
            <line x1="376" y1="112" x2="400" y2="112"/><line x1="376" y1="120" x2="400" y2="120"/>
          </g>
          <g stroke="#777166" stroke-width="1.3">
            <line x1="292" y1="120" x2="292" y2="180"/><line x1="340" y1="120" x2="340" y2="180"/><line x1="388" y1="120" x2="388" y2="180"/>
          </g>
          <text x="268" y="140" font-size="8.5">C8 470&#181;F</text>
          <text x="322" y="155" font-size="8.5">C9 10&#181;F</text>
          <text x="374" y="140" font-size="8.5">C10 100nF</text>

          <!-- MAX3485 -->
          <rect x="452" y="96" width="140" height="78" rx="2" fill="#eceae4" stroke="currentColor" stroke-width="1.4"/>
          <text x="522" y="116" text-anchor="middle" font-size="10" fill="#23211d">U3  MAX3485</text>
          <text x="522" y="130" text-anchor="middle" font-size="8.5">auto-direction module</text>
          <text x="462" y="150" font-size="8.5">RXD TXD 3V3 GND</text>
          <text x="462" y="164" font-size="8.5">A   B</text>
          <line x1="522" y1="58" x2="522" y2="96" stroke="#17786e" stroke-width="1.6"/>
          <circle cx="522" cy="58" r="3" fill="#17786e"/>
          <line x1="452" y1="140" x2="408" y2="140" stroke="#6D3BD1" stroke-width="1.5"/>
          <text x="404" y="144" text-anchor="end" fill="#6D3BD1" font-size="10">D3 D4</text>

          <!-- SWGND island -->
          <rect x="430" y="300" width="470" height="92" rx="3" fill="none" stroke="#6b4ea8" stroke-width="2" stroke-dasharray="6 4"/>
          <text x="444" y="320" fill="#6b4ea8" font-size="11" font-weight="600">SWGND island &#8212; no copper to GND anywhere</text>
          <text x="444" y="338" font-size="9.5">U3 GND &#183; R8 680 &#937; bias pull-down &#183; DS18B20 GND &#183; U4/U5 isolator GND (Sheet C)</text>
          <text x="444" y="356" fill="#b3231b" font-size="9.5">the DRC will report this as an unconnected net. That is the intended result.</text>
          <line x1="560" y1="174" x2="560" y2="300" stroke="#6b4ea8" stroke-width="1.8"/>
          <line x1="56" y1="102" x2="56" y2="346" stroke="#6b4ea8" stroke-width="1.8"/>
          <line x1="56" y1="346" x2="430" y2="346" stroke="#6b4ea8" stroke-width="1.8"/>

          <!-- A/B + bias + terminator -->
          <line x1="592" y1="140" x2="900" y2="140" stroke="#6D3BD1" stroke-width="2"/>
          <line x1="592" y1="164" x2="900" y2="164" stroke="#6D3BD1" stroke-width="2"/>
          <text x="860" y="132" fill="#6D3BD1" font-size="10">A</text>
          <text x="860" y="182" fill="#6D3BD1" font-size="10">B</text>
          <rect x="632" y="142" width="20" height="20" fill="#ffffff" stroke="#6D3BD1" stroke-width="1.3"/>
          <text x="658" y="157" font-size="9">RT1 120 &#937;</text>
          <line x1="642" y1="140" x2="642" y2="142" stroke="#6D3BD1" stroke-width="1.3"/>
          <line x1="642" y1="162" x2="642" y2="164" stroke="#6D3BD1" stroke-width="1.3"/>

          <line x1="700" y1="140" x2="700" y2="58" stroke="currentColor" stroke-width="1.2"/>
          <rect x="691" y="84" width="18" height="24" fill="#ffffff" stroke="currentColor" stroke-width="1.2"/>
          <text x="714" y="100" font-size="9">R7 680 &#937;</text>
          <circle cx="700" cy="58" r="3" fill="#17786e"/>
          <circle cx="700" cy="140" r="3" fill="#6D3BD1"/>
          <line x1="760" y1="164" x2="760" y2="300" stroke="currentColor" stroke-width="1.2"/>
          <rect x="751" y="216" width="18" height="24" fill="#ffffff" stroke="currentColor" stroke-width="1.2"/>
          <text x="774" y="232" font-size="9">R8 680 &#937; &#8594; SWGND</text>
          <circle cx="760" cy="164" r="3" fill="#6D3BD1"/>

          <!-- DS18B20 + 1-wire pull-up -->
          <rect x="140" y="212" width="104" height="44" rx="2" fill="#eceae4" stroke="currentColor" stroke-width="1.3"/>
          <text x="192" y="230" text-anchor="middle" font-size="10" fill="#23211d">X2  DS18B20</text>
          <text x="192" y="244" text-anchor="middle" font-size="8.5">3V3REG &#183; DQ &#183; SWGND</text>
          <line x1="192" y1="212" x2="192" y2="58" stroke="#17786e" stroke-width="1.4"/>
          <circle cx="192" cy="58" r="3" fill="#17786e"/>
          <line x1="140" y1="234" x2="96" y2="234" stroke="currentColor" stroke-width="1.3"/>
          <text x="92" y="238" text-anchor="end" font-size="10">A2</text>
          <line x1="118" y1="234" x2="118" y2="170" stroke="currentColor" stroke-width="1.2"/>
          <rect x="109" y="186" width="18" height="24" fill="#ffffff" stroke="currentColor" stroke-width="1.2"/>
          <text x="104" y="180" text-anchor="end" font-size="9">R9 4.7k</text>
          <line x1="118" y1="170" x2="118" y2="58" stroke="#17786e" stroke-width="1.2"/>
          <circle cx="118" cy="58" r="3" fill="#17786e"/>

          <!-- probe terminals -->
          <rect x="800" y="416" width="110" height="52" rx="2" fill="#eceae4" stroke="#b07a10" stroke-width="1.4"/>
          <text x="855" y="436" text-anchor="middle" font-size="10" fill="#23211d">X3 / X4</text>
          <text x="855" y="450" text-anchor="middle" font-size="8.5">+12V GND A B</text>
          <text x="855" y="462" text-anchor="middle" font-size="8">one block per probe</text>
          <line x1="900" y1="140" x2="920" y2="140" stroke="#6D3BD1" stroke-width="2"/>
          <line x1="920" y1="140" x2="920" y2="416" stroke="#6D3BD1" stroke-width="2"/>

          <line x1="16" y1="180" x2="400" y2="180" stroke="#777166" stroke-width="2.2"/>
          <text x="20" y="198" fill="#777166" font-size="10">GND &#8212; capacitors only</text>
        </g>
      </svg>
